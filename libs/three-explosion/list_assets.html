<!DOCTYPE html>
<!--
    デスクトップで python -m http.server
    http://localhost:8000/ActiveCamera/screen_painter/three-explosion/list_assets.html
    assetsフォルダのすべてのjsonを読み込んで表示する。
-->
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>assets一覧</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Prevent scrollbars */
            background-color: #1a1a1a;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <canvas id="mainCanvas"></canvas>

    <script async src="https://ga.jspm.io/npm:es-module-shims@1.8.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "../../../neko_editor/libs/three.js-master.r176/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { libQuarks } from './dist/explosion-bundle.js';

        function initThree() {
            const canvas = document.getElementById('mainCanvas');

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xaaaaaa);
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 10;
            camera.lookAt(scene.position)
            const renderer = new THREE.WebGLRenderer({ canvas });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const quarks = new libQuarks(scene);

            return { canvas, scene, camera, renderer, quarks }
        }

        // 内部で作るcanvasサイズとfontsizeは適当なので違う環境で動かす時、たぶん調整が必要になる。
        function createAndPlaceText(scene, text, x, y, z = 0, fontSize = '12px', color = 'white', bgColor = 'rgba(0, 0, 0, 0.5)') {
            // 一時的な2Dキャンバスを生成
            const tempCanvas = document.createElement('canvas');
            const context = tempCanvas.getContext('2d');

            // テキストのサイズを計測
            context.font = `${fontSize} Arial`;
            const textMetrics = context.measureText(text);
            const textWidth = textMetrics.width;

            // 2Dキャンバスのサイズをテキストに合わせて調整
            const canvasWidth = textWidth * 3 + 40; // 左右にパディング
            const canvasHeight = parseInt(fontSize) * 3 + 20; // 上下にパディング
            tempCanvas.width = canvasWidth;
            tempCanvas.height = canvasHeight;

            // 背景を描画
            context.fillStyle = bgColor;
            // context.fillRect(0, 0, canvasWidth, canvasHeight);
            context.clearRect(0, 0, canvasWidth, canvasHeight)

            // テキストを描画
            context.fillStyle = color;
            context.font = `${fontSize} Arial`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, canvasWidth / 2, canvasHeight / 2);

            // 2DキャンバスをThree.jsのテクスチャに変換
            const texture = new THREE.CanvasTexture(tempCanvas);
            texture.needsUpdate = true;

            // テクスチャを貼るためのPlaneGeometryを作成
            const aspectRatio = tempCanvas.width / tempCanvas.height;
            const geometry = new THREE.PlaneGeometry(1 * aspectRatio, 1);
            const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const plane = new THREE.Mesh(geometry, material);

            // 3D空間の指定された位置に配置
            plane.position.set(x, y, z);

            // シーンに追加
            scene.add(plane);
        }


        // 非同期関数：指定されたURLからファイル一覧を取得
        async function getFilenamesFromDirectoryListing(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP Error! Status: ${response.status}`);
                }

                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const links = doc.querySelectorAll('a');

                const filenames = Array.from(links)
                    .map(link => link.textContent.trim())
                    .filter(filename => filename !== 'Parent Directory' && filename !== '');

                return filenames;
            } catch (error) {
                console.error('Error fetching or parsing the directory listing:', error);
                return null;
            }
        }

        // アプリケーションの起動
        async function startApp() {
            const threeInfo = initThree();
            const folder_name = './assets';
            const filenames = await getFilenamesFromDirectoryListing(folder_name);

            if (filenames === null || filenames.length === 0) {
                console.log('No files found or an error occurred.');
                return;
            }


            const n = Math.ceil(Math.sqrt(filenames.length));
            const width = threeInfo.canvas.width / n;
            const height = threeInfo.canvas.height / n;

            // ファイル名からタイルの初期データを生成
            const tiles = filenames.map((filename, i) => {
                const col = i % n;
                const row = Math.floor(i / n);

                const x = col * width;
                const y = row * height;
                const center = { x: x + width / 2, y: y + height / 2 };
                return { filename, x, y, center, width, height }
            });

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            const zPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            tiles.forEach(async tile => {
                mouse.x = (tile.center.x / threeInfo.canvas.width) * 2 - 1;
                mouse.y = -(tile.center.y / threeInfo.canvas.height) * 2 + 1;
                raycaster.setFromCamera(mouse, threeInfo.camera);
                const intersectionPoint = new THREE.Vector3();
                raycaster.ray.intersectPlane(zPlane, intersectionPoint);

                createAndPlaceText(threeInfo.scene, tile.filename.slice(0, -5), intersectionPoint.x, intersectionPoint.y - 1.0);
                const particles = await threeInfo.quarks.loadJson(`${folder_name}/${tile.filename}`, { position: intersectionPoint });
                threeInfo.quarks.add(particles)
            })
            requestAnimationFrame(buildAnimate(threeInfo));
        }

        function buildAnimate(threeInfo) {
            const animate = function () {
                requestAnimationFrame(animate);
                threeInfo.renderer.render(threeInfo.scene, threeInfo.camera);
                threeInfo.quarks.update();
            }
            return animate;
        }
        document.addEventListener('DOMContentLoaded', startApp);
    </script>
</body>

</html>
